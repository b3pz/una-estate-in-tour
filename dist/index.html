<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#263e39"><meta name="description" content="Tre amici, otto città, un'estate per trovare il proprio suono."><title>Una estate in tour</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"></head><body><main id="screen" class="game-screen" aria-label="Una estate in tour">
<canvas id="game" width="960" height="600" tabindex="0" aria-label="Mondo di gioco. Frecce o WASD per camminare, E per parlare. Attraversa i sentieri per cambiare zona."></canvas>
<div class="world-hud" id="worldHud"><div class="location-card"><span id="season">GIUGNO</span><strong id="location">Borgo delle Cicale</strong><span id="areaSubtitle">IL PAESE DI CASA</span></div><nav class="game-menu" aria-label="Menu di gioco"><button id="mapBtn">Mappa <kbd>M</kbd></button><button id="bandBtn">Repertorio</button><button id="settingsBtn" aria-label="Apri menu di gioco">Menu <kbd>Esc</kbd></button></nav></div>
<div id="areaSign" class="area-sign" aria-live="polite" hidden><strong id="areaSignName"></strong><span id="areaSignSub"></span></div><div id="objectiveCard" class="objective-card"><span>◆</span><p id="objective"></p></div><div id="prompt" class="prompt" hidden></div><div id="toast" class="toast" role="status" hidden></div><div id="overlay" class="overlay" hidden></div><div id="transition" class="transition" aria-hidden="true"></div>
<div id="rhythmHud" class="rhythm-hud" hidden><span id="songLabel"></span><span id="scoreLabel"></span><button id="pauseSong">Pausa Ⅱ</button><button id="exitSong">Esci ×</button></div><div id="laneControls" class="lane-controls" hidden></div>
<div class="touch-controls" id="touchControls"><div class="dpad"><button data-move="up" aria-label="Vai su">↑</button><button data-move="left" aria-label="Vai a sinistra">←</button><button data-move="down" aria-label="Vai giù">↓</button><button data-move="right" aria-label="Vai a destra">→</button></div><button id="touchStart" class="start-btn" aria-label="Menu Start">START</button><div class="ab-buttons"><button id="touchBike" aria-label="Bici">B</button><button id="touchAction" aria-label="Parla, usa">A</button></div></div>

<div hidden><span id="sceneBadge"></span><span id="instrumentTag"></span><span id="passCount"></span><span id="passGrid"></span><span id="saveLabel"></span><button id="soundBtn"></button></div>
</main><script type="module" src="./game.js"></script></body></html>
